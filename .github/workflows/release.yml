name: Publish release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - LICENSE
      - README.md
      - pyproject.toml
      - scripts/check_wheel.py
      - scripts/smoke_public_api.py
      - src/**
      - uv.lock
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.14"
      - run: uv sync --locked --group dev
      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv build
      - run: >-
          uv run --locked --group dev
          python scripts/check_wheel.py dist/*.whl
      - run: >-
          uv pip install --target .release-smoke
          --no-deps --reinstall ./dist/*.whl
      - run: >-
          PYTHONPATH=.release-smoke
          .venv/bin/python scripts/smoke_public_api.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/stoch-ir
    permissions:
      id-token: write # Authenticate to TestPyPI through short-lived OIDC.

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stoch-ir
    permissions:
      id-token: write # Authenticate to PyPI through short-lived OIDC.

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
